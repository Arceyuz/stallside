<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Stallside — aisle inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0e0d0b; --elev:#161512; --card:#1c1a16; --line:rgba(243,238,228,.08); --ink:#f3eee4; --mute:#9a9286; --faint:#6e675c; --copper:#c57a48; --copper-dim:rgba(197,122,72,.16); --sage:#7fa184; --sage-dim:rgba(127,161,132,.14); --warn:#d4a054; --warn-dim:rgba(212,160,84,.14); --bad:#c45c48; --bad-dim:rgba(196,92,72,.16); --radius:16px; --safe-b:env(safe-area-inset-bottom,0px); }
    *{box-sizing:border-box;margin:0;padding:0} html,body{height:100%}
    body{font-family:IBM Plex Sans,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit} button{background:none;border:0;cursor:pointer}
    .serif{font-family:Fraunces,Georgia,serif} .app{min-height:100%;display:flex;flex-direction:column} .hidden{display:none!important}
    .gate{min-height:100%;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 20% 0%,rgba(197,122,72,.18),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(127,161,132,.08),transparent 45%),var(--bg)}
    .gate-card{width:min(420px,100%)} .mark{width:44px;height:44px;border-radius:12px;background:var(--copper-dim);color:var(--copper);display:grid;place-items:center;font-family:Fraunces,serif;font-weight:600;font-size:22px;margin-bottom:20px}
    .gate h1{font-family:Fraunces,serif;font-size:36px;font-weight:480;letter-spacing:-.03em} .gate p{color:var(--mute);margin:8px 0 28px;line-height:1.45}
    .pin-row{display:flex;gap:10px;margin-bottom:16px} .pin-row input{flex:1;height:52px;text-align:center;letter-spacing:.4em;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:20px}
    .primary{width:100%;height:48px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
    .ghost{color:var(--mute);font-size:13px;margin-top:14px;text-align:center;width:100%} .hint{font-size:12px;color:var(--faint);margin-top:18px}
    header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px 10px}
    .top-row{display:flex;align-items:center;gap:12px} .brand{flex:1;min-width:0} .brand small{display:block;color:var(--faint);font-size:11px;letter-spacing:.12em;text-transform:uppercase} .brand strong{font-family:Fraunces,serif;font-size:20px;font-weight:480}
    .icon-btn{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
    .search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px} .search input{flex:1;background:none;border:0;outline:none}
    .loc-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none} .loc-bar::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:13px;background:transparent} .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
    main{flex:1;padding:16px 16px calc(88px + var(--safe-b))}
    .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px} .kpi span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)} .kpi b{display:block;margin-top:6px;font-family:Fraunces,serif;font-size:28px;font-weight:480} .kpi em{font-style:normal;font-size:12px;color:var(--mute)}
    .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 10px} .section-h h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600} .section-h button{color:var(--copper);font-size:13px;font-weight:600}
    .list{display:flex;flex-direction:column;gap:8px}
    .item{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
    .item .name{font-weight:550} .item .meta{color:var(--mute);font-size:12px;margin-top:3px}
    .qty{text-align:right} .qty b{display:block;font-family:Fraunces,serif;font-size:22px;font-weight:480} .qty small{color:var(--mute);font-size:11px}
    .badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;margin-right:6px}
    .b-ok{background:var(--sage-dim);color:var(--sage)} .b-low{background:var(--warn-dim);color:var(--warn)} .b-out{background:var(--bad-dim);color:var(--bad)} .b-dea{background:var(--copper-dim);color:var(--copper)}
    nav.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#221f1a;border:1px solid var(--line);border-radius:18px;padding:6px}
    nav.dock button{height:52px;border-radius:12px;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;letter-spacing:.04em}
    nav.dock button.on{background:var(--elev);color:var(--ink)} nav.dock svg{width:18px;height:18px}
    h1{font-family:Fraunces,serif;font-weight:480;font-size:28px;letter-spacing:-.02em;margin-bottom:6px} .lede{color:var(--mute);margin-bottom:18px;line-height:1.45}
    .form{display:grid;gap:10px} label.f{display:grid;gap:6px;font-size:12px;color:var(--mute)} label.f input,label.f select,label.f textarea{height:44px;padding:0 12px;border-radius:10px;background:var(--elev);border:1px solid var(--line)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
    .sheet-card{width:min(560px,100%);background:var(--elev);border-radius:22px 22px 0 0;padding:18px 18px calc(20px + var(--safe-b));border:1px solid var(--line);max-height:88vh;overflow:auto}
    .grab{width:36px;height:4px;border-radius:99px;background:#3a372f;margin:0 auto 14px}
    .actions{display:flex;gap:8px;margin-top:14px} .actions .primary{flex:1}
    .secondary{flex:1;height:48px;border-radius:12px;border:1px solid var(--line);color:var(--ink)}
    .feed{display:grid;gap:8px} .feed article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px} .feed time{color:var(--faint);font-size:11px}
    .empty{color:var(--faint);padding:28px 8px;text-align:center}
    .stat-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)} .stat-row:last-child{border-bottom:0}
    @media (min-width:880px){.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%} nav.dock{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;width:240px;border-radius:0;grid-template-columns:1fr;align-content:start;padding:20px 12px;border:0;border-right:1px solid var(--line);background:var(--elev)} nav.dock button{flex-direction:row;justify-content:flex-start;gap:10px;height:44px;padding:0 12px;font-size:14px} header.top{grid-column:2} main{grid-column:2;padding-bottom:40px} .kpis{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
  <div id="gate" class="gate"><div class="gate-card"><div class="mark">S</div><h1>Stallside</h1><p>Inventory for the aisle. Separate from WD Inventory. Not hosted on Netlify.</p><div class="pin-row"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" /></div><button class="primary" onclick="unlock()">Enter clinic</button><button class="ghost" onclick="unlock(true)">Continue as demo tech</button><p class="hint">Demo PIN <strong style="color:var(--mute)">2218</strong> · GitHub Pages · WD Inventory untouched</p></div></div>
  <div id="app" class="app hidden"><div class="shell"><nav class="dock" id="dock"></nav><div><header class="top"><div class="top-row"><div class="brand"><small>Tech · Demo barn</small><strong class="serif" id="pageTitle">Stallside</strong></div><button class="icon-btn" onclick="openQuick()">+</button></div><div class="search" id="searchWrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg><input id="q" placeholder="Search name, code, or class…" oninput="render()" /></div><div class="loc-bar" id="locs"></div></header><main id="main"></main></div></div></div>
  <div id="sheet" class="sheet hidden" onclick="if(event.target.id==='sheet')closeSheet()"><div class="sheet-card" id="sheetCard"></div></div>
<script>
const KEY='stallside.v1',PIN='2218';
const ICONS={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>',move:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h10M17 7l-3-3M17 7l-3 3M17 17H7M7 17l3-3M7 17l3 3"/></svg>',log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="6" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="18" r="1.2"/></svg>'};
const SEED={clinic:'Weston Davis Equine · demo',locations:[{id:'wd',name:'Clinic bay'},{id:'janes',name:'Janes truck'},{id:'chanutin',name:'Chanutin truck'}],items:[{id:'i1',name:'Banamine paste 1500mg',code:'BAN-P',cls:'NSAID',loc:'wd',qty:14,par:8,unit:'tube',dea:false,cost:28.4},{id:'i2',name:'Phenylbutazone 1g tabs',code:'BUTE-1',cls:'NSAID',loc:'wd',qty:86,par:40,unit:'tab',dea:false,cost:.42},{id:'i3',name:'Dormosedan 10mg/ml',code:'DET-10',cls:'Sedation',loc:'wd',qty:3,par:4,unit:'vial',dea:false,cost:86},{id:'i4',name:'Xylazine 100mg/ml',code:'XYL-100',cls:'Sedation',loc:'janes',qty:6,par:4,unit:'vial',dea:false,cost:18},{id:'i5',name:'Ketamine 100mg/ml',code:'KET-100',cls:'Anesthetic',loc:'wd',qty:5,par:3,unit:'vial',dea:true,schedule:'C-III',cost:22},{id:'i6',name:'Butorphanol 10mg/ml',code:'TORB',cls:'Opioid',loc:'wd',qty:2,par:3,unit:'vial',dea:true,schedule:'C-IV',cost:34},{id:'i7',name:'Acepromazine 10mg/ml',code:'ACE-10',cls:'Sedation',loc:'chanutin',qty:8,par:3,unit:'vial',dea:false,cost:12},{id:'i8',name:'SMZ 960mg',code:'SMZ-960',cls:'Antibiotic',loc:'wd',qty:120,par:60,unit:'tab',dea:false,cost:.18},{id:'i9',name:'Excede 200mg/ml',code:'EXC-200',cls:'Antibiotic',loc:'janes',qty:1,par:2,unit:'vial',dea:false,cost:148},{id:'i10',name:'Adequan i.m. 500mg',code:'ADQ-500',cls:'Joint',loc:'wd',qty:9,par:6,unit:'vial',dea:false,cost:42},{id:'i11',name:'GastroGard 2.28g',code:'GG-228',cls:'GI',loc:'wd',qty:0,par:4,unit:'syringe',dea:false,cost:38},{id:'i12',name:'Tetanus toxoid',code:'TET',cls:'Vaccine',loc:'chanutin',qty:11,par:6,unit:'dose',dea:false,cost:9},{id:'i13',name:'Flu / Rhino',code:'FLU-RH',cls:'Vaccine',loc:'janes',qty:7,par:6,unit:'dose',dea:false,cost:18},{id:'i14',name:'18g x 1.5 needle',code:'N-1815',cls:'Consumable',loc:'wd',qty:240,par:100,unit:'ea',dea:false,cost:.08},{id:'i15',name:'Chlorhex 2% scrub',code:'CHX-2',cls:'Prep',loc:'wd',qty:4,par:3,unit:'bottle',dea:false,cost:11},{id:'i16',name:'Vetrap 4in',code:'VR-4',cls:'Consumable',loc:'janes',qty:18,par:12,unit:'roll',dea:false,cost:1.6},{id:'i17',name:'Ketamine 100mg/ml',code:'KET-100',cls:'Anesthetic',loc:'janes',qty:1,par:2,unit:'vial',dea:true,schedule:'C-III',cost:22},{id:'i18',name:'Banamine paste 1500mg',code:'BAN-P',cls:'NSAID',loc:'chanutin',qty:3,par:4,unit:'tube',dea:false,cost:28.4},{id:'i19',name:'Legacy HA 20mg',code:'LEG-20',cls:'Joint',loc:'wd',qty:2,par:2,unit:'vial',dea:false,cost:96},{id:'i20',name:'Sterile prep pack',code:'PREP',cls:'Prep',loc:'wd',qty:22,par:15,unit:'pack',dea:false,cost:3.2}],activity:[{t:Date.now()-36e5,text:'Seeded demo barn. WD Inventory was not touched.'}],transfers:[],deaLog:[],stockouts:[],loc:'all',view:'home'};
let state=load(),sheetItem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return structuredClone(SEED)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function locName(id){return (state.locations.find(l=>l.id===id)||{}).name||id}
function statusOf(it){return it.qty<=0?'out':it.qty<it.par?'low':'ok'}
function badge(it){const s=statusOf(it),label=s==='out'?'Out':s==='low'?'Low':'OK',cls=s==='out'?'b-out':s==='low'?'b-low':'b-ok';return `<span class="badge ${cls}">${label}</span>`+(it.dea?`<span class="badge b-dea">${it.schedule||'DEA'}</span>`:'')}
function filtered(){const q=(document.getElementById('q')?.value||'').trim().toLowerCase();return state.items.filter(it=>{if(state.loc!=='all'&&it.loc!==state.loc)return false;if(!q)return true;return [it.name,it.code,it.cls,locName(it.loc)].join(' ').toLowerCase().includes(q)}).sort((a,b)=>a.name.localeCompare(b.name)||locName(a.loc).localeCompare(locName(b.loc)))}
function log(text){state.activity.unshift({t:Date.now(),text});state.activity=state.activity.slice(0,80);save()}
function unlock(demo){const pin=document.getElementById('pin').value;if(!demo&&pin!==PIN){document.getElementById('pin').style.borderColor='var(--bad)';return}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
function setView(v){state.view=v;save();render()} function setLoc(id){state.loc=id;save();render()}
function renderDock(){const tabs[['home','Home',ICONS.home],['stock','Stock',ICONS.stock],['move','Move',ICONS.move],['dea','DEA',ICONS.log],['more','More',ICONS.more]];document.getElementById('dock').innerHTML=tabs.map(([id,label,icon])=>`<button class="${state.view===id?'on':''}" onclick="setView('${id}')">${icon}<span>${label}</span></button>`).join('')}
function renderLocs(){const show=['home','stock'].includes(state.view);const el=document.getElementById('locs');document.getElementById('searchWrap').classList.toggle('hidden',!show);if(!show){el.innerHTML='';return}const chips=[{id:'all',name:'All bays'},...state.locations];el.innerHTML=chips.map(c=>`<button class="chip ${state.loc===c.id?'on':''}" onclick="setLoc('${c.id}')">${c.name}</button>`).join('')}
function itemRow(it){return `<button class="item" onclick="openItem('${it.id}')"><div><div class="name">${it.name}</div><div class="meta">${badge(it)}${it.code} · ${locName(it.loc)} · ${it.cls}</div></div><div class="qty"><b>${it.qty}</b><small>${it.unit} · par ${it.par}</small></div></button>`}
function renderHome(){const items=state.items,low=items.filter(i=>statusOf(i)==='low').length,out=items.filter(i=>statusOf(i)==='out').length,dea=items.filter(i=>i.dea).length,value=items.reduce((s,i)=>s+i.qty*(i.cost||0),0),urgent=filtered().filter(i=>statusOf(i)!=='ok');return `<div class="kpis"><div class="kpi"><span>On hand value</span><b>$${Math.round(value).toLocaleString()}</b><em>demo dollars</em></div><div class="kpi"><span>Low</span><b>${low}</b><em>below par</em></div><div class="kpi"><span>Stockouts</span><b>${out}</b><em>need a pull</em></div><div class="kpi"><span>Controlled</span><b>${dea}</b><em>DEA lines</em></div></div><div class="section-h"><h2>Needs a hand</h2><button onclick="setView('stock')">All stock</button></div><div class="list">${urgent.length?urgent.map(itemRow).join(''):'<div class="empty">Every bay is at par.</div>'}</div><div class="section-h" style="margin-top:22px"><h2>Latest</h2></div><div class="feed">${state.activity.slice(0,5).map(a=>`<article><div>${a.text}</div><time>${new Date(a.t).toLocaleString()}</time></article>`).join('')}</div>`}
function renderStock(){const rows=filtered();return `<div class="section-h"><h2>${rows.length} lines</h2><button onclick="openQuick()">New line</button></div><div class="list">${rows.map(itemRow).join('')||'<div class="empty">Nothing matches.</div>'}</div>`}
function renderMove(){const pending=state.transfers.filter(t=>t.status==='open');return `<h1>Move stock</h1><p class="lede">Transfers between Clinic bay and the trucks. Confirm on receive.</p><div class="form"><label class="f">Item<select id="mvItem">${state.items.map(i=>`<option value="${i.id}">${i.name} · ${locName(i.loc)} (${i.qty})</option>`).join('')}</select></label><div class="row2"><label class="f">To<select id="mvTo">${state.locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></label><label class="f">Qty <input id="mvQty" type="number" min="1" value="1" /></label></div><button class="primary" onclick="createTransfer()">Start transfer</button></div><div class="section-h" style="margin-top:24px"><h2>Open transfers</h2></div><div class="list">${pending.length?pending.map(t=>`<div class="item"><div><div class="name">${t.name}</div><div class="meta">${locName(t.from)} → ${locName(t.to)} · ${t.qty} ${t.unit}</div></div><button class="chip on" onclick="receiveTransfer('${t.id}')">Receive</button></div>`).join(''):'<div class="empty">No open moves.</div>'}</div>`}
function renderDea(){const lines=state.items.filter(i=>i.dea);return `<h1>Controlled</h1><p class="lede">Every pull writes a line. Not a substitute for the bound DEA book.</p><div class="list">${lines.map(itemRow).join('')}</div><div class="section-h" style="margin-top:22px"><h2>Log</h2></div><div class="feed">${state.deaLog.length?state.deaLog.map(d=>`<article><div><strong>${d.name}</strong> −${d.qty} ${d.unit} · ${d.patient||'unspecified'}</div><div class="meta" style="color:var(--mute);font-size:12px;margin-top:4px">${d.reason||''} · ${locName(d.loc)} · ${d.by}</div><time>${new Date(d.t).toLocaleString()}</time></article>`).join(''):'<div class="empty">No controlled pulls yet.</div>'}</div>`}
function renderMore(){const byLoc=state.locations.map(l=>{const n=state.items.filter(i=>i.loc===l.id).length,out=state.items.filter(i=>i.loc===l.id&&i.qty<=0).length;return `<div class="stat-row"><span>${l.name}</span><b>${n} lines · ${out} out</b></div>`}).join('');return `<h1>Clinic</h1><p class="lede">${state.clinic}. Browser-only. WD Inventory untouched. Hosted on GitHub Pages, not Netlify.</p><div class="kpi" style="margin-bottom:16px">${byLoc}</div><div class="form"><button class="primary" onclick="exportJson()">Export JSON</button><button class="secondary" onclick="resetDemo()">Reset demo data</button></div><p class="hint">PIN 2218</p>`}
function render(){renderDock();renderLocs();document.getElementById('pageTitle').textContent={home:'Today',stock:'Stock',move:'Transfers',dea:'Controlled',more:'Stallside'}[state.view]||'Stallside';document.getElementById('main').innerHTML=({home:renderHome,stock:renderStock,move:renderMove,dea:renderDea,more:renderMore}[state.view]||renderHome)()}
function closeSheet(){document.getElementById('sheet').classList.add('hidden')}
function showSheet(html){document.getElementById('sheetCard').innerHTML='<div class="grab"></div>'+html;document.getElementById('sheet').classList.remove('hidden')}
function openItem(id){const it=state.items.find(x=>x.id===id);if(!it)return;sheetItem=it;showSheet(`<div class="meta">${badge(it)}</div><h1 style="margin-top:8px">${it.name}</h1><p class="lede">${it.code} · ${it.cls} · ${locName(it.loc)}${it.dea?' · controlled '+(it.schedule||''):''}</p><div class="row2"><label class="f">On hand <input id="edQty" type="number" min="0" value="${it.qty}" /></label><label class="f">Par <input id="edPar" type="number" min="0" value="${it.par}" /></label></div><label class="f" style="margin-top:10px">Note / patient<input id="edNote" placeholder="${it.dea?'Required for controlled pull':'Optional'}" /></label><div class="actions"><button class="secondary" onclick="adjust(-1)">Use 1</button><button class="primary" onclick="saveItem()">Save count</button></div>${it.qty===0?'<button class="secondary" style="width:100%;margin-top:8px" onclick="markStockout()">Flag stockout</button>':''}`)}
function saveItem(){const it=sheetItem,qty=+document.getElementById('edQty').value,par=+document.getElementById('edPar').value,note=document.getElementById('edNote').value.trim();if(it.dea&&qty<it.qty)state.deaLog.unshift({t:Date.now(),name:it.name,qty:it.qty-qty,unit:it.unit,loc:it.loc,patient:note||'unspecified',reason:'Count adjust',by:'Demo tech'});log(`Set ${it.name} at ${locName(it.loc)} to ${qty} ${it.unit}`);it.qty=qty;it.par=par;save();closeSheet();render()}
function adjust(delta){const it=sheetItem,next=Math.max(0,it.qty+delta);if(it.dea&&delta<0){const note=document.getElementById('edNote').value.trim();state.deaLog.unshift({t:Date.now(),name:it.name,qty:Math.abs(delta),unit:it.unit,loc:it.loc,patient:note||'unspecified',reason:'Use',by:'Demo tech'})}it.qty=next;log(`${delta<0?'Used':'Added'} ${Math.abs(delta)} ${it.unit} ${it.name} · ${locName(it.loc)}`);if(it.qty===0&&!state.stockouts.find(s=>s.itemId===it.id&&s.status==='open'))state.stockouts.push({id:'so'+Date.now(),itemId:it.id,name:it.name,loc:it.loc,status:'open',t:Date.now()});save();closeSheet();render()}
function markStockout(){const it=sheetItem;if(!state.stockouts.find(s=>s.itemId===it.id&&s.status==='open')){state.stockouts.push({id:'so'+Date.now(),itemId:it.id,name:it.name,loc:it.loc,status:'open',t:Date.now()});log('Stockout flagged: '+it.name)}save();closeSheet();render()}
function openQuick(){showSheet(`<h1>New line</h1><p class="lede">Adds to this clinic only.</p><div class="form"><label class="f">Name <input id="nName" /></label><div class="row2"><label class="f">Code <input id="nCode" /></label><label class="f">Class<select id="nCls"><option>NSAID</option><option>Sedation</option><option>Antibiotic</option><option>Vaccine</option><option>Joint</option><option>Consumable</option><option>Prep</option><option>Anesthetic</option><option>Opioid</option><option>GI</option></select></label></div><div class="row2"><label class="f">Location<select id="nLoc">${state.locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></label><label class="f">Qty <input id="nQty" type="number" value="1" min="0" /></label></div><div class="row2"><label class="f">Par <input id="nPar" type="number" value="2" min="0" /></label><label class="f">Unit <input id="nUnit" value="vial" /></label></div><label class="f"><span><input id="nDea" type="checkbox" /> Controlled</span></label><button class="primary" onclick="addItem()">Add to bay</button></div>`)}
function addItem(){const name=document.getElementById('nName').value.trim();if(!name)return;const it={id:'i'+Date.now(),name,code:document.getElementById('nCode').value.trim()||'NEW',cls:document.getElementById('nCls').value,loc:document.getElementById('nLoc').value,qty:+document.getElementById('nQty').value||0,par:+document.getElementById('nPar').value||0,unit:document.getElementById('nUnit').value||'ea',dea:document.getElementById('nDea').checked,schedule:document.getElementById('nDea').checked?'C-?':undefined,cost:0};state.items.push(it);log('Added '+it.name);save();closeSheet();setView('stock')}
function createTransfer(){const fromItem=state.items.find(i=>i.id===document.getElementById('mvItem').value),to=document.getElementById('mvTo').value,qty=+document.getElementById('mvQty').value;if(!fromItem||to===fromItem.loc||qty<1||qty>fromItem.qty){alert('Pick a different bay and a qty that exists.');return}fromItem.qty-=qty;state.transfers.unshift({id:'tr'+Date.now(),status:'open',name:fromItem.name,code:fromItem.code,unit:fromItem.unit,from:fromItem.loc,to,qty,dea:fromItem.dea});log('Transfer opened');save();render()}
function receiveTransfer(id){const t=state.transfers.find(x=>x.id===id);if(!t)return;let dest=state.items.find(i=>i.code===t.code&&i.loc===t.to);if(!dest){dest={id:'i'+Date.now(),name:t.name,code:t.code,cls:'Transfer',loc:t.to,qty:0,par:1,unit:t.unit,dea:t.dea,cost:0};state.items.push(dest)}dest.qty+=t.qty;t.status='received';log('Received at '+locName(t.to));save();render()}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='stallside-export.json';a.click()}
function resetDemo(){if(!confirm('Reset demo barn?'))return;localStorage.removeItem(KEY);state=structuredClone(SEED);save();render()}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script>
</body>
</html>
